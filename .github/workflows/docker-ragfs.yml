name: Docker RAGFS

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Docker platform to build
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ragfs-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push RAGFS image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ragfs
          tags: |
            type=raw,value=obsidian-integration
            type=sha,prefix=obsidian-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ragfs
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
