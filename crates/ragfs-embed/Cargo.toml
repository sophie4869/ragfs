[package]
name = "ragfs-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local embedding generation for RAGFS using Candle"
keywords = ["embeddings", "machine-learning", "candle", "rag"]
categories = ["science", "text-processing"]

[features]
default = ["candle"]
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
]
# Metal is macOS-only. Candle's metal backend pulls in the `metal` crate and,
# through it, `objc_exception`, whose build script needs an Objective-C compiler
# (`cc1obj`) that Linux runners do not have. Forwarding `candle-*/metal` from a
# plain feature would enable that everywhere, because CI builds `--all-features`.
# The backend is attached by the macOS-only target dependency below instead, and
# this feature stays as the switch that names it.
metal = ["candle"]

[dependencies]
ragfs-core.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
directories.workspace = true
blake3.workspace = true

# Optional: Candle ML stack
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# macOS only: adds Candle's Metal backend to the very same optional crates
# declared above. Cargo unions the features of a dependency across
# `[dependencies]` and `[target.*.dependencies]`, so this is purely additive on
# macOS and invisible on every other target.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }
candle-nn = { workspace = true, optional = true, features = ["metal"] }
candle-transformers = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
